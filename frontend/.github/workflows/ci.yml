# Legacy: GitHub only runs workflows under the repository root .github/workflows/.
# Active pipeline: ../.github/workflows/ci.yml (frontend job).

name: Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: OpenAPI matches hub
        run: npm run openapi:check-sync

      - name: Run style lint
        run: npm run lint:style

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:3000
        run: npm run build
